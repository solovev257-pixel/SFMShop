<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFMShop - Управление товарами</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
        h1 { text-align: center; color: #333; }
        h2 { margin-top: 28px; color: #444; }
        form { background: #f5f5f5; padding: 20px; border-radius: 6px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-bottom: 14px; box-sizing: border-box; }
        button { padding: 10px 18px; border: none; border-radius: 4px; background: #2e7d32; color: #fff; cursor: pointer; }
        button:hover { background: #1b5e20; }
        button:disabled { background: #9e9e9e; cursor: default; }
        #loadCatalogBtn { margin-top: 24px; background: #1565c0; }
        #loadCatalogBtn:hover { background: #0d47a1; }
        .status { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Управление товарами SFMShop</h1>

    <h2>Вход</h2>
    <form id="loginForm">
        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <label for="password">Пароль:</label>
        <input type="password" id="password" required>

        <button type="submit">Войти</button>
    </form>
    <div id="loginStatus" class="status">Чтобы добавлять товары, войдите</div>

    <h2>Новый товар</h2>
    <form id="productForm">
        <label for="name">Название:</label>
        <input type="text" id="name" maxlength="100" required>

        <label for="price">Цена, руб.:</label>
        <input type="number" id="price" step="0.01" min="0.01" required>

        <label for="quantity">Остаток на складе:</label>
        <input type="number" id="quantity" min="0" required>

        <button type="submit" id="saveBtn" disabled>Сохранить товар</button>
    </form>
    <div id="formStatus" class="status"></div>

    <button id="loadCatalogBtn" type="button">Показать каталог</button>
    <div id="catalog" class="status"></div>

    <script>
        const API = '/api/v1';
        // Токен живёт только в памяти страницы: после перезагрузки нужно войти снова
        let accessToken = null;

        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const status = document.getElementById('loginStatus');
            try {
                const response = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    }),
                });
                if (!response.ok) {
                    status.textContent = 'Неверный email или пароль';
                    return;
                }
                accessToken = (await response.json()).access_token;
                status.textContent = 'Вход выполнен';
                document.getElementById('saveBtn').disabled = false;
            } catch (error) {
                status.textContent = `Сервер недоступен: ${error.message}`;
            }
        });

        document.getElementById('productForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const status = document.getElementById('formStatus');
            const payload = {
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value),
                quantity: parseInt(document.getElementById('quantity').value),
            };
            try {
                const response = await fetch(`${API}/products`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (response.status === 401) {
                    status.textContent = 'Сессия истекла, войдите снова';
                } else if (response.status === 422) {
                    status.textContent = 'Проверьте поля: название не пустое, цена больше нуля';
                } else if (response.ok) {
                    const product = await response.json();
                    status.textContent = `Товар сохранён, id ${product.id}`;
                    event.target.reset();
                } else {
                    status.textContent = `Сервер отклонил запрос, статус ${response.status}`;
                }
            } catch (error) {
                status.textContent = `Сервер недоступен: ${error.message}`;
            }
        });

        document.getElementById('loadCatalogBtn').addEventListener('click', async () => {
            const catalog = document.getElementById('catalog');
            catalog.textContent = 'Загрузка...';
            try {
                const response = await fetch(`${API}/products?limit=100`);
                if (!response.ok) {
                    catalog.textContent = `Каталог не загрузился, статус ${response.status}`;
                    return;
                }
                const page = await response.json();
                catalog.textContent = '';
                if (page.products.length === 0) {
                    catalog.textContent = 'Каталог пуст';
                    return;
                }
                const list = document.createElement('ul');
                for (const item of page.products) {
                    const row = document.createElement('li');
                    row.textContent = `${item.name} — ${item.price} руб., осталось ${item.quantity} шт.`;
                    list.appendChild(row);
                }
                catalog.appendChild(list);
                catalog.append(`Всего товаров: ${page.total}`);
            } catch (error) {
                catalog.textContent = `Сервер недоступен: ${error.message}`;
            }
        });
    </script>
</body>
</html>

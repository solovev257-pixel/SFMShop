services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # ровно те переменные, которые читает код проекта
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=sfmshop
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sfmshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # при первом запуске создаёт таблицы и тестовые товары
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"   # 5433 снаружи, чтобы не мешать локальному PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sfmshop"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 6380 снаружи, чтобы не мешать локальному Redis
    volumes:
      - redis_data:/data
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sfmshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'                 # кэш зависимостей, чтобы не качать их на каждом запуске

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint with ruff
        # критичные ошибки: синтаксис и неопределённые имена
        run: ruff check src/ --select E9,F63,F7,F82

      - name: Type check with mypy
        run: mypy src/core src/utils src/api src/database --ignore-missing-imports

      - name: Run tests with coverage
        env:
          # те же имена, что читает src/database/connection.py
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sfmshop_test
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: pytest tests/ --cov=src --cov-report=xml --cov-report=term

      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  deploy:
    needs: test                        # деплой только после зелёных тестов
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: sfmshop:${{ github.sha }}

      - name: Deploy to production
        run: |
          echo "Образ sfmshop:${{ github.sha }} собран"
          echo "Здесь: push образа в реестр и docker compose pull && up -d на сервере по SSH"
          echo "Доступы к серверу хранятся в GitHub Secrets"
